<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6A4A"/>
      <stop offset="0.55" stop-color="#E5432B"/>
      <stop offset="1" stop-color="#9E2416"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#F2A23A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- plate -->
  <circle cx="256" cy="268" r="150" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle cx="256" cy="268" r="150" fill="none" stroke="#FFFFFF" stroke-width="22"/>
  <circle cx="256" cy="268" r="98" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="10"/>
  <!-- fork -->
  <g fill="#FFFFFF">
    <rect x="140" y="96" width="14" height="70" rx="7"/>
    <rect x="166" y="96" width="14" height="70" rx="7"/>
    <rect x="192" y="96" width="14" height="70" rx="7"/>
    <path d="M140 150 h66 v22 a33 33 0 0 1 -22 31 v68 a11 11 0 0 1 -22 0 v-68 a33 33 0 0 1 -22 -31z"/>
  </g>
  <!-- coin -->
  <circle cx="352" cy="352" r="78" fill="url(#coin)" stroke="#FFFFFF" stroke-width="12"/>
  <text x="352" y="377" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="72" fill="#7A2A10">kr</text>
</svg>
